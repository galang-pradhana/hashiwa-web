<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="4" fill="#000000" />
  <g opacity="0.95">
    <!-- Layer 1: Bottom subtle glow / base triangles -->
    <polygon points="5,5 95,5 50,50" fill="#0E7490" fill-opacity="0.2" />
    <polygon points="5,95 95,95 50,50" fill="#0E7490" fill-opacity="0.2" />
    <polygon points="5,5 5,95 50,50" fill="#0F766E" fill-opacity="0.15" />
    <polygon points="95,5 95,95 50,50" fill="#0F766E" fill-opacity="0.15" />

    <!-- Layer 2: Main translucent origami panels shaping double diamonds/bridge -->
    <!-- Left main diamond -->
    <polygon points="5,5 50,15 32,50" fill="#14B8A6" fill-opacity="0.55" />
    <polygon points="5,95 50,85 32,50" fill="#0891B2" fill-opacity="0.5" />
    <polygon points="5,5 32,50 5,95" fill="#0F766E" fill-opacity="0.6" />
    <!-- Center connection left -->
    <polygon points="50,15 32,50 50,50" fill="#2DD4BF" fill-opacity="0.65" />
    <polygon points="50,85 32,50 50,50" fill="#06B6D4" fill-opacity="0.6" />

    <!-- Right main diamond -->
    <polygon points="95,5 50,15 68,50" fill="#14B8A6" fill-opacity="0.55" />
    <polygon points="95,95 50,85 68,50" fill="#0891B2" fill-opacity="0.5" />
    <polygon points="95,5 68,50 95,95" fill="#0F766E" fill-opacity="0.6" />
    <!-- Center connection right -->
    <polygon points="50,15 68,50 50,50" fill="#2DD4BF" fill-opacity="0.65" />
    <polygon points="50,85 68,50 50,50" fill="#06B6D4" fill-opacity="0.6" />

    <!-- Central standing diamonds shaping the main twin peak geometry -->
    <polygon points="50,15 32,50 50,85" fill="#0D9488" fill-opacity="0.3" />
    <polygon points="50,15 68,50 50,85" fill="#0D9488" fill-opacity="0.3" />

    <!-- Layer 3: Dynamic high-precision crystalline lines matching the "Agile Connect" theme -->
    <line x1="5" y1="5" x2="50" y2="15" stroke="#34D399" stroke-width="0.5" stroke-opacity="0.6" />
    <line x1="5" y1="95" x2="50" y2="85" stroke="#34D399" stroke-width="0.5" stroke-opacity="0.6" />
    <line x1="95" y1="5" x2="50" y2="15" stroke="#34D399" stroke-width="0.5" stroke-opacity="0.6" />
    <line x1="95" y1="95" x2="50" y2="85" stroke="#34D399" stroke-width="0.5" stroke-opacity="0.6" />

    <line x1="50" y1="15" x2="32" y2="50" stroke="#E0F2FE" stroke-width="0.75" stroke-opacity="0.8" />
    <line x1="50" y1="85" x2="32" y2="50" stroke="#E0F2FE" stroke-width="0.75" stroke-opacity="0.8" />
    <line x1="50" y1="15" x2="68" y2="50" stroke="#E0F2FE" stroke-width="0.75" stroke-opacity="0.8" />
    <line x1="50" y1="85" x2="68" y2="50" stroke="#E0F2FE" stroke-width="0.75" stroke-opacity="0.8" />

    <line x1="32" y1="50" x2="50" y2="50" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.7" />
    <line x1="68" y1="50" x2="50" y2="50" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.7" />
    <line x1="50" y1="15" x2="50" y2="85" stroke="#E0F2FE" stroke-width="0.5" stroke-opacity="0.4" />

    <line x1="5" y1="5" x2="32" y2="50" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.5" />
    <line x1="5" y1="95" x2="32" y2="50" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.5" />
    <line x1="95" y1="5" x2="68" y2="50" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.5" />
    <line x1="95" y1="95" x2="68" y2="50" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.5" />
  </g>
</svg>
